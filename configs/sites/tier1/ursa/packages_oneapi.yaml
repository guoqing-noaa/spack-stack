packages:
  all:
    compiler:: [oneapi@2023.2.0]
    providers:
      mpi:: [intel-oneapi-mpi@2021.13]
      # Remove the next three lines to switch to intel-oneapi-mkl
      blas:: [openblas]
      fftw-api:: [fftw]
      lapack:: [openblas]
  mpi:
    buildable: False
  intel-oneapi-mpi:
    buildable: False
    externals:
    - spec: intel-oneapi-mpi@2021.13%oneapi@2023.2.0
      modules:
      - intel-oneapi-mpi/2021.13.1
      prefix: /apps/spack-2024-12/linux-rocky9-x86_64/oneapi-2023.2.0/intel-oneapi-mpi-2021.13.1-66y2dsdqzran6wjlk7oglxlr5za3dbh6
  intel-oneapi-mkl:
    # Remove buildable: False and uncomment externals section below to use intel-oneapi-mkl
    buildable: False
    #externals:
    #- spec: intel-oneapi-mkl@2022.0.2%intel@2021.5.0
    #  prefix: /apps/oneapi
  # DH* Remove this section to switch to intel-oneapi-mkl
  ectrans:
    require::
    - '@1.2.0 ~mkl +fftw'
  gsibec:
    require::
    - '@1.2.1 ~mkl'
  py-numpy:
    require::
    - '@:1.23 ^openblas'
  # *DH
  zlib-ng:
    require:
      - '~shared'
  intel-oneapi-runtime:
    externals:
    - spec: intel-oneapi-runtime@2023.2.0%oneapi@2023.2.0
      prefix: /apps/spack-2024-12/linux-rocky9-x86_64/gcc-11.4.1/intel-oneapi-compilers-2023.2.0-uov33rpz3lplh3hh3v5c6vssbc7ndxuk/compiler/2023.2.0
  gcc-runtime:
    externals:
    - spec: gcc-runtime@11.4.1%gcc@11.4.1
      prefix: /usr

